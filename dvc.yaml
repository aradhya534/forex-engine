stages:
  ingest:
    cmd: python -m src.components.data_ingestion
    deps:
      - src/components/data_ingestion.py
      - data/raw/daily_forex_rates.csv
    params:
      - data
      - cleaning
    outs:
      - artifacts/clean.parquet

  transform:
    cmd: python -m src.components.data_transformation
    deps:
      - src/components/data_transformation.py
      - artifacts/clean.parquet
    params:
      - features
      - split
    outs:
      - artifacts/features.parquet
      - artifacts/fit.parquet
      - artifacts/calibration.parquet
      - artifacts/test.parquet

  train:
    cmd: python -m src.components.model_trainer
    deps:
      - src/components/model_trainer.py
      - artifacts/fit.parquet
      - artifacts/calibration.parquet
      - artifacts/test.parquet
    params:
      - model
      - paths
      - features.lags
      - features.windows
    outs:
      - artifacts/model.joblib
      - artifacts/signal_config.json
    metrics:
      - artifacts/metrics.json:
          cache: false